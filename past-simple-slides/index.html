<!doctype html>
<html lang="th" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Past Simple">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Past Simple สไลด์</title>
<link rel="preload" href="../fonts/FCVision-Regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="../fonts/FCVision-Bold.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face { font-family: 'FC Vision'; font-weight: 400; font-style: normal; font-display: swap; src: url('../fonts/FCVision-Regular.woff2') format('woff2'); }
@font-face { font-family: 'FC Vision'; font-weight: 700; font-style: normal; font-display: swap; src: url('../fonts/FCVision-Bold.woff2') format('woff2'); }
html { --bg:#F6F3EE; --fg:#1B1530; --muted:#6B6580; --line:#CFC8DC; --card:#FFFFFF;
  --v2:#2E8B4F; --tm:#3B6FD8; --ad:#D8482C; --ng:#C93A82; --pu:#6B46C1; color-scheme: light; }
html[data-theme="dark"] { --bg:#000000; --fg:#FFFFFF; --muted:#9A9AA6; --line:#3A3A44; --card:#15131F;
  --v2:#56AC6B; --tm:#7FA3F0; --ad:#F07A5F; --ng:#E873AE; --pu:#A98BFF; color-scheme: dark; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--fg); overflow: hidden; overscroll-behavior: none; transition: background .3s, color .3s;
  font-family: 'FC Vision', 'Sarabun', 'Thonburi', 'Noto Sans Thai', system-ui, sans-serif;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
button { font: inherit; }
button:focus-visible, a:focus-visible { outline: 3px solid var(--muted); outline-offset: 3px; }

.stage { position: fixed; left: 50%; top: 50%; width: 1180px; height: 820px; overflow: hidden; transform-origin: 50% 50%; transform: translate(-50%, -50%); }
.back { position: absolute; left: 24px; top: 70px; z-index: 5; color: var(--muted); text-decoration: none; font-size: 18px; padding: 8px 4px; opacity: .8; transition: opacity .3s; }
.stage[data-i]:not([data-i="0"]) .back { opacity: 0; pointer-events: none; }
.theme-btn { position: absolute; right: 24px; top: 64px; z-index: 5; width: 52px; height: 52px; border-radius: 50%; border: 2px solid var(--line); background: transparent; color: var(--muted); display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; }
.theme-btn .sun { display: none; }
html[data-theme="light"] .theme-btn .sun { display: block; }
html[data-theme="light"] .theme-btn .moon { display: none; }

/* slides */
.slide { position: absolute; left: 96px; right: 96px; top: 130px; bottom: 90px; display: none; flex-direction: column; gap: 26px; }
.slide.on { display: flex; }
.kick { margin: 0; font-size: 26px; letter-spacing: .04em; color: var(--muted); }
.h { margin: 0; font-size: 64px; font-weight: 700; line-height: 1.15; }
.sub { margin: 0; font-size: 30px; color: var(--muted); }
.sent { margin: 0; font-size: 46px; line-height: 1.3; }
.v2 { color: var(--v2); font-weight: 700; } .tm { color: var(--tm); font-weight: 700; } .ad { color: var(--ad); font-weight: 700; } .ng { color: var(--ng); font-weight: 700; } .pu { color: var(--pu); font-weight: 700; }
.card { background: var(--card); border: 2px solid var(--line); border-radius: 24px; padding: 28px 32px; }
.chip { display: inline-block; border: 2px solid var(--tm); border-radius: 999px; padding: 4px 22px; font-size: 28px; color: var(--tm); font-weight: 700; }
.row { display: flex; align-items: center; gap: 24px; }
.big { display: flex; align-items: center; gap: 24px; font-size: 104px; font-weight: 700; line-height: 1.1; }
.big .w1 { width: 420px; text-align: center; }
.big .ar { color: var(--muted); font-weight: 400; }
.rule { font-size: 34px; line-height: 1.45; }
.base { color: var(--muted); font-weight: 400; }
.fg { color: var(--fg); font-weight: 700; }

/* reveal: guess first, tap to show */
[data-s] { opacity: 0; visibility: hidden; transform: translateY(14px); transition: opacity .35s, transform .35s, visibility 0s .35s; }
[data-s].shown { opacity: 1; visibility: visible; transform: none; transition: opacity .35s, transform .35s, visibility 0s; }
[data-h].gone { display: none; }
/* result words fade in place (no slide) */
span[data-s] { transform: none; }

.foot { position: absolute; left: 0; right: 0; bottom: 30px; text-align: center; font-size: 20px; color: var(--muted); letter-spacing: .08em; pointer-events: none; }
.bar { position: absolute; left: 0; bottom: 0; height: 5px; background: var(--pu); transition: width .3s; }
.hint { position: absolute; left: 0; right: 0; bottom: 70px; text-align: center; font-size: 22px; color: var(--muted); opacity: 0; transition: opacity .4s; pointer-events: none; }
.stage[data-i="0"] .hint { opacity: .9; }
</style>
</head>
<body>
<div id="safeTop" style="position:fixed;left:0;top:0;width:0;height:env(safe-area-inset-top,0px);pointer-events:none"></div>
<div class="stage" id="stage" data-i="0">
  <a class="back" href="../" id="backLink">← สื่อทั้งหมด</a>
  <button class="theme-btn" id="themeBtn" type="button" aria-label="สลับโหมดสว่างและมืด">
    <svg class="moon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path></svg>
    <svg class="sun" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>
  </button>
  <div id="slides"></div>
  <div class="hint">แตะครึ่งขวา = ต่อไป · แตะครึ่งซ้าย = ย้อนกลับ</div>
  <div class="foot" id="foot"></div>
  <div class="bar" id="bar"></div>
</div>

<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var stage = $('stage');

  /* helpers: s(n, html) = appears at step n ; sw(base, ans, cls, n) = (base) becomes ans at step n */
  function s(n, html, tag) { tag = tag || 'span'; return '<' + tag + ' data-s="' + n + '">' + html + '</' + tag + '>'; }
  function sw(base, ans, cls, n) { return '<span data-h="' + n + '" class="base">(' + base + ')</span><span data-s="' + n + '" class="' + cls + '">' + ans + '</span>'; }
  function sd(n, html, attr) { return '<div data-s="' + n + '" ' + (attr || '') + '>' + html + '</div>'; }

  function edRule(num, w1, r1, w2, r2, rule) {
    return { steps: 2, html:
      '<p class="kick">หลักการเติม -ed · ข้อ ' + num + ' / 5</p>' +
      '<div style="display:flex;flex-direction:column;gap:14px;margin-top:8px">' +
      '<div class="big"><span class="w1">' + w1 + '</span><span class="ar" data-s="1">→</span><span data-s="1">' + r1 + '</span></div>' +
      '<div class="big"><span class="w1">' + w2 + '</span><span class="ar" data-s="1">→</span><span data-s="1">' + r2 + '</span></div></div>' +
      '<div class="card rule" data-s="2" style="margin-top:14px">' + rule + '</div>' };
  }
  var IRR = [['go','went'],['run','ran'],['see','saw'],['win','won'],['buy','bought'],['meet','met'],['take','took'],['fly','flew'],['find','found'],['break','broke']];
  var irrHtml = '';
  IRR.forEach(function (p, i) {
    var n = Math.floor(i / 2) + 1;
    irrHtml += '<div class="big" style="font-size:44px;padding:8px 0;border-bottom:2px solid var(--line)"><span style="width:190px">' + p[0] + '</span><span class="ar" data-s="' + n + '">→</span><span class="v2" data-s="' + n + '">' + p[1] + '</span></div>';
  });

  var SLIDES = [
    { steps: 0, html:
      '<div style="flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:18px;margin-top:-20px">' +
      '<h1 class="h" style="font-size:130px;line-height:1.05">Past Simple Tense</h1>' +
      '<p class="sub">เหตุการณ์ที่จบไปแล้วในอดีต</p></div>' },

    { steps: 2, html:
      '<p class="kick">การใช้ที่ 1</p>' +
      '<h2 class="h">เหตุการณ์ที่เกิดและ<span class="v2">จบแล้ว</span>ในอดีต</h2>' +
      '<div style="display:flex;align-items:center;margin:10px 0 4px;font-size:24px;color:var(--muted)"><span style="white-space:nowrap">อดีต · Past</span>' +
      '<div style="flex-grow:1;height:4px;background:var(--line);margin:0 18px;border-radius:2px"></div>' +
      '<span style="width:22px;height:22px;border-radius:50%;background:var(--fg);display:inline-block"></span>' +
      '<span style="margin-left:12px;white-space:nowrap;color:var(--fg)">ตอนนี้ · Now</span></div>' +
      '<div style="display:flex;flex-wrap:wrap;gap:12px"><span class="chip">yesterday</span><span class="chip">last week</span><span class="chip">last month</span><span class="chip">last year</span><span class="chip">… ago</span><span class="chip">in 2005</span></div>' +
      '<p class="sent">The concert ' + sw('start', 'started', 'v2', 1) + ' at 8:00 PM <span class="tm">last night</span>.</p>' +
      '<p class="sent">He ' + sw('cook', 'cooked', 'v2', 2) + ' dinner for his family <span class="tm">yesterday</span>.</p>' },

    { steps: 1, html:
      '<p class="kick">การใช้ที่ 2</p>' +
      '<h2 class="h">สิ่งที่ทำ<span class="v2">เป็นประจำ</span>ในอดีต</h2>' +
      '<p class="sub">และตอนนี้ไม่ได้ทำแล้ว · มักมี Adverb of Frequency</p>' +
      '<div style="display:flex;gap:40px;align-items:flex-start;margin-top:6px">' +
      '<p class="sent" style="flex:1;font-size:42px">I <span class="ad">sometimes</span> ' + sw('visit', 'visited', 'v2', 1) + ' my grandparents on weekends.</p>' +
      '<div class="card" style="width:440px;display:flex;flex-direction:column;gap:10px;font-size:27px;white-space:nowrap;padding:22px 28px">' +
      [['Always','เสมอ','100%'],['Usually','ปกติ','90%'],['Often','บ่อยๆ','70–80%'],['Sometimes','บางครั้ง','50%','ad'],['Seldom','นานๆ ครั้ง','10–20%'],['Never','ไม่เคย','0%']].map(function (r) {
        return '<div class="row"><span style="width:130px;font-weight:700' + (r[3] ? ';color:var(--ad)' : '') + '">' + r[0] + '</span><span style="flex:1;color:var(--muted)">' + r[1] + '</span><span>' + r[2] + '</span></div>';
      }).join('') + '</div></div>' },

    { steps: 2, html:
      '<p class="kick">ตำแหน่งของ Adverb of Frequency</p>' +
      '<h2 class="h">Adverb อยู่ตรงไหน ?</h2>' +
      '<div style="margin-top:10px"><p class="sub" style="margin-bottom:8px;min-height:44px">' + s(1, '<span class="ad">อยู่หน้า</span> verb') + '</p>' +
      '<p class="sent">She <span class="ad">always</span> <span class="v2">walked</span> to school last year.</p></div>' +
      '<div style="margin-top:22px"><p class="sub" style="margin-bottom:8px;min-height:44px">' + s(2, '<span class="ad">อยู่หลัง</span> verb to be') + '</p>' +
      '<p class="sent">We <span class="v2">were</span> <span class="ad">sometimes</span> late for class.</p></div>' },

    { steps: 1, html:
      '<p class="kick">Verb ช่อง 2 (V.2)</p>' +
      '<h2 class="h">มี 2 ประเภท</h2>' +
      '<div style="display:flex;gap:28px;margin-top:10px">' +
      '<div class="card" style="flex:1;display:flex;flex-direction:column;gap:14px"><p style="margin:0;font-size:40px;font-weight:700;color:var(--pu)">Regular verb</p><p class="sub" style="color:var(--fg)">เติม <b>-ed</b> ได้เลย</p>' +
      '<p class="sent v2" style="font-size:36px;min-height:140px" data-s="1">played<br>studied<br>walked</p></div>' +
      '<div class="card" style="flex:1;display:flex;flex-direction:column;gap:14px"><p style="margin:0;font-size:40px;font-weight:700;color:var(--ng)">Irregular verb</p><p class="sub" style="color:var(--fg)">เปลี่ยนรูป หรือเหมือนกันทั้ง 3 ช่อง</p>' +
      '<p class="sent v2" style="font-size:36px;min-height:140px" data-s="1">go – went – gone<br>cut – cut – cut</p></div></div>' },

    edRule(1, 'walk', 'walk<span class="v2">ed</span>', 'cook', 'cook<span class="v2">ed</span>', 'กริยาทั่วไป เติม -ed ได้เลย'),
    edRule(2, 'love', 'love<span class="v2">d</span>', 'hope', 'hope<span class="v2">d</span>', 'ลงท้ายด้วย e → เติม d ได้เลย'),
    edRule(3, 'deny', 'den<span class="v2">ied</span>', 'modify', 'modif<span class="v2">ied</span>', 'ลงท้ายด้วย พยัญชนะ + y → เปลี่ยน y เป็น i แล้วเติม ed'),
    edRule(4, 'play', 'play<span class="v2">ed</span>', 'stay', 'stay<span class="v2">ed</span>', 'ลงท้ายด้วย สระ + y → เติม ed ได้เลย'),
    edRule(5, 'stop', 'stop<span class="v2">ped</span>', 'plan', 'plan<span class="v2">ned</span>', 'พยางค์เดียว สระตัวเดียว ลงท้ายพยัญชนะตัวเดียว → ซ้ำตัวท้ายอีก 1 ตัว แล้วเติม ed'),

    { steps: 5, html:
      '<p class="kick">Irregular verb</p>' +
      '<h2 class="h">ไม่มีกฎ <span class="ng">ต้องจำ</span></h2>' +
      '<div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 56px;margin-top:6px">' + irrHtml + '</div>' },

    { steps: 2, html:
      '<p class="kick">3 รูปประโยค · V.inf = กริยาที่ไม่ผัน</p>' +
      '<h2 class="h">บอกเล่า · ปฏิเสธ · คำถาม</h2>' +
      '<div style="display:flex;flex-direction:column;gap:14px;margin-top:0">' +
      '<div class="card" style="padding:16px 30px"><p style="margin:0 0 6px;font-size:28px;color:var(--muted)">บอกเล่า &nbsp; <b class="fg">S + <span class="v2">V.2</span></b></p><p class="sent" style="font-size:40px">She <span class="v2">ate</span> fried eggs for breakfast.</p></div>' +
      '<div class="card" data-s="1" style="padding:16px 30px"><p style="margin:0 0 6px;font-size:28px;color:var(--muted)">ปฏิเสธ &nbsp; <b class="fg">S + <span class="ng">did not</span> + V.inf</b></p><p class="sent" style="font-size:40px">She <span class="ng">didn’t eat</span> fried eggs for breakfast.</p></div>' +
      '<div class="card" data-s="2" style="padding:16px 30px"><p style="margin:0 0 6px;font-size:28px;color:var(--muted)">คำถาม &nbsp; <b class="fg"><span class="tm">Did</span> + S + V.inf ?</b></p><p class="sent" style="font-size:40px"><span class="tm">Did</span> she <span class="tm">eat</span> fried eggs for breakfast?</p></div></div>' },

    { steps: 2, html:
      '<p class="kick">ประโยคปฏิเสธ</p>' +
      '<h2 class="h">เติม <span class="ng">did not</span> หน้ากริยาแท้</h2>' +
      '<p class="sent" style="margin-top:8px">He <span class="ng">did not finish</span> his homework before dinner.</p>' +
      '<p class="sub" data-s="1">did เป็นอดีตอยู่แล้ว → กริยาแท้กลับเป็น <b class="fg">V.inf</b></p>' +
      '<div class="card" data-s="2" style="margin-top:10px"><p class="sub" style="font-size:28px;margin-bottom:8px">แต่ถ้าเป็น <b class="fg">was / were</b> → ใส่ not หลัง be ได้เลย</p>' +
      '<p class="sent" style="font-size:40px">They <span class="ng">were not</span> at the park yesterday.</p></div>' },

    { steps: 2, html:
      '<p class="kick">ประโยคคำถาม</p>' +
      '<h2 class="h">เติม <span class="tm">did</span> ไว้หน้าประโยค</h2>' +
      '<p class="sent" style="margin-top:8px"><span class="tm">Did</span> they <span class="tm">watch</span> a movie together at the cinema on Saturday?</p>' +
      '<p class="sub" data-s="1">did เป็นอดีตอยู่แล้ว → กริยาแท้กลับเป็น <b class="fg">V.inf</b></p>' +
      '<div class="card" data-s="2" style="margin-top:10px"><p class="sub" style="font-size:28px;margin-bottom:8px">แต่ถ้าเป็น <b class="fg">was / were</b> → ยก be ไปไว้หน้าประโยค</p>' +
      '<p class="sent" style="font-size:40px"><span class="tm">Was</span> he the captain of the soccer team?</p></div>' },

    { steps: 1, html:
      '<p class="kick">Verb to be ในอดีต</p>' +
      '<h2 class="h"><span class="pu">Was</span> หรือ <span class="pu">Were</span> ?</h2>' +
      '<div style="display:flex;gap:28px;margin-top:10px">' +
      '<div class="card" style="flex:1"><p style="margin:0;font-size:56px;font-weight:700;color:var(--pu)">Was</p><p class="sub" style="color:var(--fg);margin-top:6px">ประธานเอกพจน์</p><p class="sent" style="font-size:32px;margin-top:12px">I / He / She / It</p></div>' +
      '<div class="card" style="flex:1"><p style="margin:0;font-size:56px;font-weight:700;color:var(--pu)">Were</p><p class="sub" style="color:var(--fg);margin-top:6px">ประธานพหูพจน์</p><p class="sent" style="font-size:32px;margin-top:12px">You / We / They</p></div></div>' +
      '<p class="h" data-s="1" style="font-size:56px;margin-top:14px">ลองทำใบงานกันเลย</p>' }
  ];

  /* ---- build ---- */
  var N = SLIDES.length, host = $('slides'), els = [];
  SLIDES.forEach(function (sl) {
    var d = document.createElement('section'); d.className = 'slide'; d.innerHTML = sl.html; host.appendChild(d); els.push(d);
  });

  var S = { i: 0, st: 0 };
  function render() {
    els.forEach(function (d, k) { d.classList.toggle('on', k === S.i); });
    var d = els[S.i];
    Array.prototype.forEach.call(d.querySelectorAll('[data-s]'), function (e) { e.classList.toggle('shown', +e.getAttribute('data-s') <= S.st); });
    Array.prototype.forEach.call(d.querySelectorAll('[data-h]'), function (e) { e.classList.toggle('gone', +e.getAttribute('data-h') <= S.st); });
    stage.setAttribute('data-i', S.i);
    $('foot').textContent = (S.i + 1) + ' / ' + N;
    $('bar').style.width = ((S.i + 1) / N * 100) + '%';
    try { history.replaceState(null, '', '#' + (S.i + 1)); } catch (e) {}
  }
  function next() {
    if (S.st < SLIDES[S.i].steps) S.st++;
    else if (S.i < N - 1) { S.i++; S.st = 0; }
    render();
  }
  function prev() {
    if (S.st > 0) S.st--;
    else if (S.i > 0) { S.i--; S.st = SLIDES[S.i].steps; }
    render();
  }

  /* tap halves */
  document.addEventListener('click', function (e) {
    if (e.target && e.target.closest && e.target.closest('button, a')) return;
    if (e.clientX < window.innerWidth / 2) prev(); else next();
  });
    document.addEventListener('keydown', function (e) {
    if (e.target && e.target.closest && e.target.closest('button, a')) return;
    if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'Enter' || e.key === 'PageDown') { e.preventDefault(); next(); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); prev(); }
  });

  /* theme */
  function setTheme(t) { document.documentElement.setAttribute('data-theme', t); }
  $('themeBtn').addEventListener('click', function (e) {
    e.stopPropagation();
    var t = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
    setTheme(t); try { localStorage.setItem('slidesv1.theme', t); } catch (x) {}
  });
  try { var t0 = localStorage.getItem('slidesv1.theme'); if (t0 === 'light' || t0 === 'dark') setTheme(t0); } catch (e) {}

  /* scale fixed stage to screen (respect iPad status bar) */
  function fit() {
    var inset = 0;
    try { inset = $('safeTop').getBoundingClientRect().height || 0; } catch (e) {}
    var h = Math.max(200, window.innerHeight - inset);
    var sc = Math.min(window.innerWidth / 1180, h / 820);
    stage.style.top = (inset + h / 2) + 'px';
