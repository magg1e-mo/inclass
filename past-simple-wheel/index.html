<style>
@font-face { font-family: 'FC Vision'; font-weight: 400; font-style: normal; font-display: swap; src: url('../fonts/FCVision-Regular.woff2') format('woff2'); }
@font-face { font-family: 'Inter Light'; font-weight: 300; font-style: normal; font-display: swap; src: url('../fonts/Inter-Light-team.woff2') format('woff2'); }
@font-face { font-family: 'FC Vision'; font-weight: 700; font-style: normal; font-display: swap; src: url('../fonts/FCVision-Bold.woff2') format('woff2'); }
html { --card: #15131F; --tm: #7FA3F0; --ad: #F07A5F; --ng: #E873AE; --pu: #A98BFF; --bg: #000000; --fg: #FFFFFF; --muted: #9A9AA6; --line: #3A3A44; --v2: #56AC6B; --shadow: rgba(0,0,0,.6); color-scheme: dark; }
html[data-theme="light"] { --card: #FFFFFF; --tm: #3B6FD8; --ad: #D8482C; --ng: #C93A82; --pu: #6B46C1; --bg: #F6F3EE; --fg: #1B1530; --muted: #6B6580; --line: #CFC8DC; --v2: #2E8B4F; --shadow: rgba(27,21,48,.25); color-scheme: light; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; touch-action: none; }
body { background: var(--bg); color: var(--fg); overflow: hidden; overscroll-behavior: none; transition: background .3s, color .3s;
  font-family: 'FC Vision', 'Sarabun', 'Thonburi', 'Noto Sans Thai', system-ui, sans-serif;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
button { font: inherit; }
button:focus-visible { outline: 3px solid var(--muted); outline-offset: 3px; }

.stage { position: fixed; left: 50%; top: 50%; width: 1180px; height: 820px; overflow: hidden; transform-origin: 50% 50%; transform: translate(-50%, -50%); }
.wheel { position: absolute; left: 317px; top: 158px; width: 553px; height: 571px; cursor: pointer; transition: transform .9s cubic-bezier(.2,.8,.2,1), translate 1.15s cubic-bezier(.2,.8,.2,1) .35s; }
.stage[data-s="start"] .wheel, .stage[data-s="intro"] .wheel { translate: 0 900px; pointer-events: none; }
.stage[data-s="landed"] .wheel, .stage[data-s="revealed"] .wheel, .stage[data-s="award"] .wheel { transform: translateX(-240px); }
.spinner { position: relative; width: 100%; height: 100%; }
.pointer { position: absolute; left: 50%; top: -6px; transform: translateX(-50%); width: 0; height: 0; border-left: 18px solid transparent; border-right: 18px solid transparent; border-top: 32px solid var(--fg); pointer-events: none; }
.lbl { position: absolute; left: 280px; top: 260px; width: 230px; height: 40px; transform-origin: 0 50%; display: flex; align-items: center; justify-content: flex-end; white-space: nowrap; font-weight: 700; }
.facewrap { position: relative; width: 100%; height: 100%; }
.facebox { position: absolute; left: 0; top: 0; width: 100%; height: 100%; transition: scale .3s; filter: drop-shadow(0 4px 10px var(--shadow)); }
.face { position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: contain; opacity: 0; transition: opacity .12s; }
.stage[data-f="z"] .face-closed, .stage[data-f="1"] .f1, .stage[data-f="2"] .f2, .stage[data-f="3"] .f3 { opacity: 1; }
.stage[data-f="2"] .facebox { scale: 1.06; }
.stage[data-f="3"] .facebox { scale: 1.14; }
.stage[data-shake="1"] .facebox { animation: faceshake .09s linear infinite; }
@keyframes faceshake { 0% { transform: translate(2px, -1px) rotate(-3deg); } 25% { transform: translate(-3px, 2px) rotate(3deg); } 50% { transform: translate(2px, 3px) rotate(-2deg); } 75% { transform: translate(-2px, -2px) rotate(4deg); } 100% { transform: translate(2px, -1px) rotate(-3deg); } }
.zz { position: absolute; left: 92px; top: -4px; font-weight: 700; color: var(--fg); opacity: 0; pointer-events: none; }
.stage[data-s="idle"] .zz { animation: zzfloat 2.8s ease-out infinite; }
@keyframes zzfloat { 0% { opacity: 0; transform: translate(0, 14px) scale(.6); } 20% { opacity: .9; } 100% { opacity: 0; transform: translate(28px, -64px) scale(1.2); } }
.hub { position: absolute; left: 50%; top: 50%; width: 138px; height: 138px; margin: -69px 0 0 -69px; display: flex; align-items: center; justify-content: center; pointer-events: none; }
.panel { position: absolute; left: 693px; top: 0; width: 440px; height: 820px; }
.wg { position: absolute; left: 0; top: 50%; width: 440px; transform: translateY(-50%); transition: transform .8s cubic-bezier(.2,.8,.2,1); }
.stage[data-s="award"] .wg { transform: translateY(calc(-50% - 120px)); }
.award-box { position: absolute; left: 0; top: 470px; width: 440px; }
.rise { opacity: 0; visibility: hidden; transform: translateY(28px); transition: opacity .25s, transform .25s, visibility 0s .25s; }
.stage[data-s="landed"] .r-word, .stage[data-s="revealed"] .r-word, .stage[data-s="award"] .r-word { opacity: 1; visibility: visible; transform: none; transition: opacity .6s ease .55s, transform .6s ease .55s, visibility 0s .55s; }
.stage[data-s="landed"] .r-reveal { opacity: 1; visibility: visible; transform: none; transition: opacity .6s ease 1.3s, transform .6s ease 1.3s, visibility 0s 1.3s; }
.stage[data-s="revealed"] .r-v2, .stage[data-s="award"] .r-v2 { opacity: 1; visibility: visible; transform: none; transition: opacity .5s ease, transform .5s ease; }
.stage[data-s="award"] .r-award { opacity: 1; visibility: visible; transform: none; transition: opacity .5s ease, transform .5s ease; }
.stage[data-s="award"] .r-v2 { opacity: .85; }
.slot { position: relative; height: 150px; margin-top: 22px; }
.slot > * { position: absolute; left: 0; top: 10px; }
.label { margin: 0 0 4px; color: var(--muted); font-size: 20px; letter-spacing: .04em; }
.word { margin: 0; font-weight: 700; line-height: 1.05; white-space: nowrap; }
.reveal { cursor: pointer; border: 0; border-radius: 999px; background: var(--fg); color: var(--bg); font-weight: 700; font-size: 32px; padding: 10px 52px; min-height: 64px; }
.v2 { margin: 0; font-weight: 700; line-height: 1.05; color: var(--v2); white-space: nowrap; left: 3px; top: -6px; }
.chip { left: -1px; top: 84px; }
.chip span { display: inline-block; margin-top: 8px; border: 2px solid var(--line); color: var(--muted); border-radius: 999px; padding: 2px 16px; font-size: 18px; }
.award-box .q { margin: 0 0 10px; color: var(--muted); font-size: 20px; }
.team-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.team-btn { cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 10px; min-height: 76px; padding: 10px 20px; border: 0; border-radius: 18px; font-weight: 700; font-size: 26px; }
.team-btn .ts { font-size: 32px; }
.skip { margin-top: 10px; min-height: 48px; background: none; border: 0; color: var(--muted); cursor: pointer; font-size: 18px; text-decoration: underline; text-underline-offset: 3px; }
.turn { position: absolute; left: 0; top: 64px; width: 1180px; text-align: center; font-family: 'Inter Light', 'FC Vision', system-ui, sans-serif; font-size: 36px; font-weight: 300; line-height: 1.2; pointer-events: none; transform-origin: 50% 0; transition: transform 1.1s cubic-bezier(.65,0,.25,1), opacity .4s; }
.stage[data-s="start"] .turn, .stage[data-s="intro"] .turn { transform: translateY(324px) scale(2.4); }
.stage[data-s="start"] .turn { opacity: 0; }
.stage[data-s="intro"] .turn { opacity: 1; transition: transform 1.1s cubic-bezier(.65,0,.25,1), opacity .7s ease .3s; }
.start-screen { position: absolute; inset: 0; z-index: 3; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 40px; transition: opacity .35s; }
.stage:not([data-s="start"]) .start-screen { opacity: 0; pointer-events: none; }
.start-title { font-size: 104px; font-weight: 400; letter-spacing: .14em; line-height: 1; padding-left: .14em; }
.start-btn { cursor: pointer; border: 0; border-radius: 999px; background: var(--fg); color: var(--bg); font-weight: 700; font-size: 32px; padding: 10px 64px; min-height: 64px; }
.scores { position: absolute; left: 0; right: 0; bottom: 22px; display: flex; justify-content: center; gap: 36px; color: var(--muted); font-size: 20px; transition: opacity .3s; }
.scores b { color: var(--fg); font-size: 26px; margin-left: 6px; }
.stage[data-s="start"] .scores, .stage[data-s="intro"] .scores, .stage[data-s="landed"] .scores, .stage[data-s="revealed"] .scores, .stage[data-s="award"] .scores { opacity: 0; }
.theme-btn { position: absolute; right: 24px; top: 64px; z-index: 5; width: 52px; height: 52px; border-radius: 50%; border: 2px solid var(--line); background: transparent; color: var(--muted); display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; }
.theme-btn .sun { display: none; }
html[data-theme="light"] .theme-btn .sun { display: block; }
html[data-theme="light"] .theme-btn .moon { display: none; }
.back { position: absolute; left: 24px; top: 70px; z-index: 5; color: var(--muted); text-decoration: none; font-size: 18px; padding: 8px 4px; opacity: .8; }
.stage:not([data-s="idle"]):not([data-s="start"]) .back { opacity: 0; pointer-events: none; }
@media (prefers-reduced-motion: reduce) { .stage, .stage * { animation: none !important; } .deck .ch { opacity: 1 !important; } .deck .tl-dot, .deck .tl-fill { transition: none !important; } }
/* slides */
.deck .slide { position: absolute; left: 96px; right: 96px; top: 130px; bottom: 90px; display: none; flex-direction: column; gap: 26px; }
.deck .slide.on { display: flex; }
.deck .kick { margin: 0; font-size: 26px; letter-spacing: .04em; color: var(--muted); }
.deck .h { margin: 0; font-size: 64px; font-weight: 700; line-height: 1.15; }
.deck .sub { margin: 0; font-size: 30px; color: var(--muted); }
.deck .sent { margin: 0; font-size: 46px; line-height: 1.3; }
.deck .s40 { font-size: 40px; }
.deck .gv { color: var(--v2); font-weight: 700; } .tm { color: var(--tm); font-weight: 700; } .ad { color: var(--ad); font-weight: 700; } .ng { color: var(--ng); font-weight: 700; } .pu { color: var(--pu); font-weight: 700; }
.deck .card { background: var(--card); border: 2px solid var(--line); border-radius: 24px; padding: 28px 32px; }
.deck .card.tight { padding: 16px 30px; }
.deck .dlbl { margin: 0 0 6px; font-size: 28px; color: var(--muted); }
.deck .schip { display: inline-block; border: 2px solid var(--tm); border-radius: 999px; padding: 4px 22px; font-size: 28px; color: var(--tm); font-weight: 700; }
.deck .chips { display: flex; flex-wrap: wrap; gap: 12px; }
.deck .row { display: flex; align-items: center; gap: 24px; }
.deck .big { display: flex; align-items: center; gap: 24px; font-size: 104px; font-weight: 700; line-height: 1.1; }
.deck .big .w1 { width: 420px; text-align: center; }
.deck .big .ar { color: var(--muted); font-weight: 400; }
.deck .big.irr { font-size: 44px; padding: 8px 0; border-bottom: 2px solid var(--line); }
.deck .big.irr .iw { width: 190px; }
.deck .rule { font-size: 34px; line-height: 1.45; }
.deck .base { color: var(--muted); font-weight: 400; }
.deck .fg { color: var(--fg); font-weight: 700; }
.deck .center { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; gap: 18px; margin-top: -20px; }
.deck .title { font-size: 130px; line-height: 1.05; }
/* every [data-r] fades up when its step is reached; space stays reserved so nothing jumps */
.deck [data-r] { opacity: 0; visibility: hidden; transform: translateY(16px); transition: opacity .4s ease, transform .4s ease, visibility 0s .4s; }
.deck [data-r].shown { opacity: 1; visibility: visible; transform: none; transition: opacity .4s ease, transform .4s ease, visibility 0s; }
.deck span[data-r] { transform: none; }
.deck .ans:not(.shown) { display: none; }
.deck .ans.shown { animation: d_ansin .45s ease both; }
@keyframes d_ansin { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.deck [data-g].gone { display: none; }
/* Past -> Now timeline: the dot runs left to right and leaves a trail */
.deck .tl { display: flex; align-items: center; margin: 10px 0 4px; font-size: 26px; color: var(--muted); }
.deck .tl-l, .deck .tl-r { white-space: nowrap; }
.deck .tl-r { color: var(--fg); margin-left: 6px; }
.deck .tl-line { position: relative; flex-grow: 1; height: 4px; background: var(--line); margin: 0 18px; border-radius: 2px; }
.deck .tl-fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: var(--tm); border-radius: 2px; }
.deck .tl-dot { position: absolute; left: 0; top: 50%; width: 26px; height: 26px; margin: -13px 0 0 0; border-radius: 50%; background: var(--fg); }
.deck .tl.shown .tl-fill { width: 100%; transition: width 1.8s cubic-bezier(.45,.05,.3,1) .25s; }
.deck .tl.shown .tl-dot { left: calc(100% - 26px); transition: left 1.8s cubic-bezier(.45,.05,.3,1) .25s; }
/* typing */
.deck .ch { display: inline-block; opacity: 0; }
.deck .wd { display: inline-block; white-space: nowrap; }
.deck [data-r].shown .ch { animation: d_chin .3s ease-out both; animation-delay: calc(var(--i) * 26ms + .15s); }
@keyframes d_chin { from { opacity: 0; transform: translateX(-16px); } to { opacity: 1; transform: none; } }
.deck .typ[data-r] { opacity: 1; transform: none; transition: none; }
.deck .typ[data-r].shown { visibility: visible; }
.deck .bar { position: absolute; left: 0; bottom: 0; height: 5px; background: var(--pu); transition: width .3s; }
.deck { position: absolute; inset: 0; display: none; }
.stage[data-s="deck"] .deck { display: block; }
.stage[data-s="deck"] .wheel, .stage[data-s="deck"] .panel, .stage[data-s="deck"] .turn, .stage[data-s="deck"] .scores,
.stage[data-s="results"] .wheel, .stage[data-s="results"] .panel, .stage[data-s="results"] .turn, .stage[data-s="results"] .scores { visibility: hidden; pointer-events: none; }
.results { position: absolute; inset: 0; z-index: 3; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 30px; text-align: center; }
.stage[data-s="results"] .results { display: flex; }
.res-kick { margin: 0; font-size: 28px; color: var(--muted); letter-spacing: .06em; }
.res-win { margin: 0; font-size: 104px; font-weight: 700; line-height: 1.1; animation: respop .7s cubic-bezier(.2,1.4,.4,1) both; }
.res-sub { margin: 0; font-size: 36px; color: var(--muted); animation: resfade .6s ease .5s both; }
.res-scores { display: flex; gap: 18px; margin-top: 18px; animation: resfade .6s ease .7s both; }
.res-tile { min-width: 190px; padding: 16px 26px; border-radius: 20px; font-weight: 700; display: flex; flex-direction: column; gap: 2px; }
.res-tile span { font-size: 26px; font-weight: 400; opacity: .9; }
.res-tile b { font-size: 60px; line-height: 1.1; }
.res-tile.lose { opacity: .55; }
.res-tile.win { transform: scale(1.12); box-shadow: 0 8px 24px var(--shadow); }
.res-hint { position: absolute; left: 0; right: 0; bottom: 40px; margin: 0; font-size: 22px; color: var(--muted); animation: resfade .6s ease 1.4s both; }
@keyframes respop { from { opacity: 0; transform: scale(.6); } to { opacity: 1; transform: none; } }
@keyframes resfade { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
#confetti { position: absolute; left: 0; top: 0; width: 1180px; height: 820px; z-index: 4; pointer-events: none; }
</style>
</head>
<body>
<div id="safeTop" style="position:fixed;left:0;top:0;width:0;height:env(safe-area-inset-top,0px);pointer-events:none"></div>
<div class="stage" id="stage" data-s="idle">

<a class="back" href="../" id="backLink">← สื่อทั้งหมด</a>

<button class="theme-btn" id="themeBtn" type="button" aria-label="สลับโหมดสว่างและมืด">
  <svg class="moon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path></svg>
  <svg class="sun" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>
</button>

<div class="wheel" id="wheel" role="button" tabindex="0" aria-label="หมุนวงล้อ">
  <div class="spinner" id="spinner">
    <svg viewBox="0 0 400 400" width="100%" height="100%" aria-hidden="true">
      <circle cx="200" cy="200" r="196" id="disc"></circle>
      <g id="paths"></g>
    </svg>
    <div id="labels"></div>
  </div>
  <div class="pointer"></div>
  <div class="hub">
    <div class="facewrap" id="facewrap">
      <div class="facebox">
        <img class="face face-closed" src="hub-face-closed.webp" alt="">
        <img class="face f1" src="face-1.webp" alt="">
        <img class="face f2" src="face-2.webp" alt="">
        <img class="face f3" src="face-3.webp" alt="">
      </div>
    </div>
    <span class="zz" style="font-size:22px;animation-delay:0s">z</span>
    <span class="zz" style="font-size:30px;animation-delay:.9s">Z</span>
    <span class="zz" style="font-size:40px;animation-delay:1.8s">Z</span>
  </div>
</div>

<div class="panel" aria-live="polite">
  <div class="wg">
    <p class="rise r-word label">คำกริยา · ช่อง 1</p>
    <p class="rise r-word word" id="word"></p>
    <div class="slot">
      <button type="button" class="rise r-reveal reveal" id="revealBtn">เฉลย</button>
      <div class="rise r-v2 chip"><span id="rule"></span></div>
      <p class="rise r-v2 v2" id="v2"></p>
    </div>
  </div>
  <div class="rise r-award award-box">
    <p class="q">ทีมไหนได้คะแนน ?</p>
    <div class="team-grid" id="teamGrid"></div>
    <button type="button" class="skip" id="skipBtn">ไม่มีทีมไหนได้ · ข้าม</button>
  </div>
</div>

<div class="deck" id="deck" data-i="0">
  <div id="slides"></div>
  <div class="bar" id="bar"></div>
</div>
<div class="results" id="results"></div>
<canvas id="confetti" width="2360" height="1640" aria-hidden="true"></canvas>
<div class="turn" id="turn"></div>
<div class="start-screen"><div class="start-title">SPINT</div><button type="button" class="start-btn" id="startBtn">เริ่ม</button></div>
<div class="scores" id="scores"></div>
</div>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var stage = $('stage'), root = document.documentElement;
  var WORDS = [['go','went'],['walk','walked'],['see','saw'],['love','loved'],['buy','bought'],['play','played'],
    ['take','took'],['stop','stopped']];
  var NAMES = ['ทีม 1', 'ทีม 2', 'ทีม 3', 'ทีม 4'];
  var TB = ['#6B46C1', '#D9488F', '#1B8F7B', '#F2B33D'], TF = ['#FFFFFF', '#FFFFFF', '#FFFFFF', '#2A1B4D'];
  var PAL = [['#6B46C1','#FFFFFF'],['#D9488F','#FFFFFF'],['#F2B33D','#2A1B4D'],['#1B8F7B','#FFFFFF'],['#3B6FD8','#FFFFFF'],['#E4573D','#FFFFFF']];
  var R = 196, n = WORDS.length, a = 360 / n;
  var S = { st: 'start', rot: 0, idx: -1, used: [], scores: [0,0,0,0], locked: false, faceRot: 0, theme: 'light', face: '1', shake: 0 };
  var timers = [], n4 = 4;

  function rule(b, v) {
    if (v === b + 'ed') return 'เติม -ed';
    if (/e$/.test(b) && v === b + 'd') return 'ลงท้าย e เติม d';
    if (/[^aeiou]y$/.test(b) && v === b.slice(0, -1) + 'ied') return 'y → i แล้วเติม -ed';
    if (v.length === b.length + 3 && v === b + b.slice(-1) + 'ed') return 'ซ้ำตัวท้าย แล้วเติม -ed';
    return 'ไม่ปกติ (Irregular)';
  }
  function pt(deg) { var r = deg * Math.PI / 180; return [(200 + R * Math.cos(r)).toFixed(2), (200 + R * Math.sin(r)).toFixed(2)]; }
  function later(fn, ms) { timers.push(setTimeout(fn, ms)); }

  /* ---- scale the fixed 1180x820 stage to the screen ---- */
  /* lock zoom: iPad Safari ignores user-scalable=no, so block pinch and double-tap in script too */
  ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (g) { document.addEventListener(g, function (e) { e.preventDefault(); }, { passive: false }); });
  document.addEventListener('touchmove', function (e) { if (e.touches.length > 1 || (e.scale && e.scale !== 1)) e.preventDefault(); }, { passive: false });
  var lastTouch = 0;
  document.addEventListener('touchend', function (e) { var t = Date.now(); if (t - lastTouch < 350) e.preventDefault(); lastTouch = t; }, { passive: false });

    var want = 270 - (target + 0.5) * a + (Math.random() - 0.5) * a * 0.6;

    S.st = 'spinning'; S.idx = target; S.rot += delta; S.faceRot -= 360 * 8; S.face = '1'; S.shake = 0;
    $('spinner').style.transition = 'transform 4400ms cubic-bezier(.12,.6,.15,1)';
    $('spinner').style.transform = 'rotate(' + S.rot + 'deg)';
    $('facewrap').style.transition = 'transform 6200ms cubic-bezier(.2,.55,.25,1)';
    $('facewrap').style.transform = 'rotate(' + S.faceRot + 'deg)';
    render();
    later(function () { if (S.st === 'spinning') { S.face = '2'; render(); } }, 1500);
    later(function () { if (S.st === 'spinning') { S.face = '3'; S.shake = 1; render(); } }, 2700);
    later(function () {
      S.used.push(target);
      var w = WORDS[target];
      $('word').textContent = w[0]; $('word').style.fontSize = sizeFor(w[0], 120) + 'px';
      $('v2').textContent = w[1]; $('v2').style.fontSize = sizeFor(w[1], 86) + 'px';
      $('rule').textContent = rule(w[0], w[1]);
      S.st = 'landed'; S.face = '3'; S.shake = 0; render();
    }, 4500);
  }
  function begin() { if (S.st !== 'start') return; keepAwake(); S.st = 'intro'; render(); later(function () { S.st = 'idle'; render(); }, 2000); }
  function reveal() { if (S.st === 'landed') { S.st = 'revealed'; render(); } }
  function pick(i) {
    if (S.st !== 'award' || S.locked) return;
    S.locked = true; S.scores[i] += 1; render();
    later(function () { S.locked = false; if (S.used.length >= n) showResults(true); else { S.st = 'idle'; render(); } }, 750);
  }
  $('wheel').addEventListener('click', function (e) { e.stopPropagation(); spin(); });
  $('wheel').addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); spin(); } });
  $('startBtn').addEventListener('click', function (e) { e.stopPropagation(); begin(); });
  $('revealBtn').addEventListener('click', function (e) { e.stopPropagation(); reveal(); });
  $('skipBtn').addEventListener('click', function (e) { e.stopPropagation(); if (S.st === 'award') { if (S.used.length >= n) showResults(true); else { S.st = 'idle'; render(); } } });
  $('backLink').addEventListener('click', function (e) { e.stopPropagation(); });
  document.documentElement.addEventListener('click', function (e) {
    if (S.st === 'revealed') { S.st = 'award'; render(); }
    else if (S.st === 'results') enterDeck();
    else if (S.st === 'deck') { if (e.clientX < window.innerWidth / 2) dprev(); else dnext(); }
  });
  $('themeBtn').addEventListener('click', function (e) {
    e.stopPropagation(); S.theme = S.theme === 'light' ? 'dark' : 'light';
    try { localStorage.setItem('wheelv3.theme', S.theme); } catch (x) {}
    render();
  });
  document.addEventListener('keydown', function (e) {
    if (e.target && e.target.closest && e.target.closest('button, a, [role="button"]')) return;
    if (S.st === 'deck') {
      if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'Enter' || e.key === 'PageDown') { e.preventDefault(); dnext(); }
      else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); dprev(); }
      return;
    }
    if (S.st === 'results') { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); enterDeck(); } return; }
    if (e.code !== 'Space' && e.key !== 'Enter') return;
    e.preventDefault();
    if (S.st === 'start') begin(); else if (S.st === 'idle') spin(); else if (S.st === 'landed') reveal(); else if (S.st === 'revealed') { S.st = 'award'; render(); }
  });

  try { var t = localStorage.getItem('wheelv3.theme'); if (t === 'light' || t === 'dark') S.theme = t; } catch (e) {}
  var hm = /^#(\d+)$/.exec(location.hash || '');
  if (hm) { S.st = 'deck'; D.i = Math.min(SN, Math.max(1, +hm[1])) - 1; drender(); }
  render();
  window.__wheel = S; /* handy for testing */
})();
</script>
