<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="สื่อการสอน">
<title>สื่อการสอน</title>
<style>
@font-face { font-family: 'FC Vision'; font-weight: 400; font-style: normal; font-display: swap;
  src: url('fonts/FCVision-Regular.woff2') format('woff2'); }
@font-face { font-family: 'FC Vision'; font-weight: 600; font-style: normal; font-display: swap;
  src: url('fonts/FCVision-SemiBold.woff2') format('woff2'); }
@font-face { font-family: 'FC Vision'; font-weight: 700; font-style: normal; font-display: swap;
  src: url('fonts/FCVision-Bold.woff2') format('woff2'); }
:root { color-scheme: light; padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
[hidden] { display: none !important; }
</style>
<style>
:root {
  --bg: #EFE7FB; --surface: #FFFFFF; --ink: #2A1B4D; --muted: #65558A; --line: #B7A2E6;
  --accent: #5B3BB5; --chip: #E6DAFB; --chip-ink: #3E2584;
  --font: 'FC Vision', 'Sarabun', 'Thonburi', 'Noto Sans Thai', system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #150F26; --surface: #21183A; --ink: #F2ECFF; --muted: #A99BD0; --line: #5A4690;
    --accent: #A98BFF; --chip: #3A2C63; --chip-ink: #E3D8FF; color-scheme: dark;
  }
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 17px; line-height: 1.45;
  padding-block: 28px 40px;
  padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px));
  -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; touch-action: manipulation;
}
.wrap { max-width: 1100px; margin: 0 auto; display: grid; gap: 24px; }
h1 { margin: 0; font-weight: 700; font-size: clamp(2.1rem, 5vw, 3.2rem); line-height: 1.1; }
.sub { margin: 6px 0 0; color: var(--muted); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); gap: 16px; }
a.media {
  display: grid; gap: 10px; align-content: start; text-decoration: none; color: inherit; min-height: 160px;
  background: var(--surface); border: 3px dashed var(--line); border-radius: 18px; padding: 20px 22px;
}
a.media:active { background: var(--chip); }
a.media:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
.name { font-size: 2rem; font-weight: 700; line-height: 1.1; color: var(--accent); }
.desc { margin: 0; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { padding: 3px 12px; border-radius: 999px; background: var(--chip); color: var(--chip-ink); font-size: .92rem; font-weight: 600; }
.open { font-weight: 600; color: var(--accent); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>สื่อการสอน</h1>
    <p class="sub">ม.2/2 · แตะการ์ดเพื่อเปิดสื่อ</p>
  </header>
  <main class="grid">
    <a class="media" href="past-simple-wheel/">
      <span class="name">วงล้อ V.2</span>
      <p class="desc">สุ่มคำกริยาให้เด็กตอบช่อง 2 พร้อมเฉลย กฎการเติม และคะแนน 4 ทีม</p>
      <span class="tags"><span class="tag">Past Simple Tense</span><span class="tag">เกมวงล้อ</span></span>
      <span class="open">เปิด →</span>
    </a>
    <a class="media" href="past-simple-slides/">
      <span class="name">สไลด์ Past Simple</span>
      <p class="desc">สไลด์ช่วง Presentation 15 หน้า แตะครึ่งขวา/ซ้ายเปลี่ยนหน้า ให้เด็กเดาก่อนแล้วแตะเฉลย</p>
      <span class="tags"><span class="tag">Past Simple Tense</span><span class="tag">สไลด์</span></span>
      <span class="open">เปิด →</span>
    </a>
  </main>
</div>
</body>
</html>
